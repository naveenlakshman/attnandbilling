substitutions:
  _REGION: asia-south1
  _SERVICE: global-it-erp-production
  _REPOSITORY: cloud-run-source-deploy
  _IMAGE_TAG: multi-v6
  _REVISION_SUFFIX: multi-v6
  _RUNTIME_SERVICE_ACCOUNT: attn-billing-runtime@global-it-edu-app.iam.gserviceaccount.com
  _CLOUD_SQL_INSTANCE: global-it-edu-app:asia-south1:global-it-erp-production-db
  _REDIS_HOST: 10.94.179.83

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - .

  - id: verify-no-legacy-bootstrap
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - APP_ENV=testing
      - --env
      - SECRET_KEY=cloud-build-regression-only
      - --env
      - PYTHONPATH=/app
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_no_legacy_bootstrap.py

  - id: verify-domain-ownership-workflow
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scripts/test_domain_verification.py

  - id: verify-platform-owner-separation
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-platform-separation-only
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_platform_owner_separation.py

  - id: verify-public-website-tenant-isolation
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-public-website-isolation-only
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_public_website_tenant_isolation.py

  - id: verify-dashboard-tenant-isolation
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-dashboard-isolation-only
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_dashboard_tenant_isolation.py

  - id: verify-lead-form-stage-guard
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-lead-stage-only
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_lead_form_stage_guard.py

  - id: verify-billing-dashboard-tenant-isolation
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - APP_ENV=testing
      - --env
      - SECRET_KEY=cloud-build-billing-dashboard-only
      - --env
      - PYTHONPATH=/app
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_billing_dashboard_tenant_isolation.py

  - id: verify-student-password-change
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-student-password-only
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_student_password_change.py

  - id: verify-lms-create-and-attach-master
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_lms_create_and_attach_master.py

  - id: verify-student-profile-readonly-signatures
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_student_profile_readonly_signatures.py

  - id: verify-student-document-access
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_student_document_access.py

  - id: verify-student-photo-storage-urls
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_student_photo_storage_urls.py

  - id: verify-certificate-template-preview-storage
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_certificate_template_preview_storage.py

  - id: verify-certificate-preview-url-fix
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-cert-preview-only
      - --env
      - PYTHONPATH=/app
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_certificate_preview_url_fix.py

  - id: verify-auth-rate-limit
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --env
      - SECRET_KEY=cloud-build-auth-limit-only
      - --env
      - PYTHONPATH=/app
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_auth_rate_limit.py

  - id: verify-lms-progress-dashboard-mysql
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - python
      - scratch/test_lms_progress_dashboard_mysql.py

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}

  - id: deploy-zero-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}
      - --revision-suffix=${_REVISION_SUFFIX}
      - --no-traffic
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --ingress=all
      - --allow-unauthenticated
      - --network=default
      - --subnet=default
      - --vpc-egress=private-ranges-only
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --concurrency=10
      - --timeout=120
      - --min-instances=0
      - --max-instances=20
      - --set-env-vars=APP_ENV=production,DEBUG_MODE=false,SESSION_COOKIE_SECURE=true,SESSION_COOKIE_NAME=__Host-erp_session,SECURITY_HEADERS_ENABLED=true,PROXY_FIX_X_FOR=1,PROXY_FIX_X_PROTO=1,PROXY_FIX_X_HOST=1,TENANT_RESOLUTION_MODE=observe,PLATFORM_CONTROL_HOSTS=admin.globaliteducation.com|attn-billing-testing-m2nph2u57q-el.a.run.app|attn-billing-testing-644631083795.asia-south1.run.app|attn-billing-testing-nuls5dpt4a-el.a.run.app,PLATFORM_DISPLAY_NAME=Global IT ERP,PLATFORM_TAGLINE=Enterprise Resource Planning,DB_TYPE=mysql,DB_CONNECTION_MODE=direct,MYSQL_HOST=127.0.0.1,MYSQL_PORT=3306,MYSQL_USER=attn_app,MYSQL_DB=global_it_erp_production,MYSQL_UNIX_SOCKET=/cloudsql/${_CLOUD_SQL_INSTANCE},STORAGE_PROVIDER=gcs,GCS_BUCKET_NAME=global-it-erp-storage,RATELIMIT_STORAGE_URI=redis://${_REDIS_HOST}:6379/0
      - --set-secrets=SECRET_KEY=attn-billing-secret-key:1,MYSQL_PASSWORD=attn-billing-mysql-password:1,GOOGLE_AI_API_KEY=attn-billing-google-ai-key:1,GOOGLE_MAPS_API_KEY=attn-billing-google-maps-key:1,TINYMCE_API_KEY=attn-billing-tinymce-key:1,SMS_GATEWAY_USER=attn-billing-sms-user:1,SMS_GATEWAY_PASSWORD=attn-billing-sms-password:1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_IMAGE_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
