<style>
  .erp-notification-modal .modal-content{border:0;border-radius:18px;overflow:hidden;box-shadow:0 22px 60px rgba(15,23,42,.24)}
  .erp-notification-accent{height:7px;background:var(--notice-color,#0d6efd)}
  .erp-notification-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;background:color-mix(in srgb,var(--notice-color,#0d6efd) 14%,white);color:var(--notice-color,#0d6efd);font-size:2rem}
  .erp-notification-message{white-space:pre-line;color:#64748b;font-size:1rem;line-height:1.65}
  .erp-notification-priority{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
  .erp-fee-details{text-align:left;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:14px;margin-bottom:16px}
  .erp-extension-form{text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:16px}
</style>
<div class="modal fade erp-notification-modal" id="studentNotificationModal" tabindex="-1" aria-labelledby="studentNotificationTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="erp-notification-accent" id="studentNotificationAccent"></div>
    <div class="modal-body text-center p-4 p-sm-5">
      <div class="erp-notification-icon" id="studentNotificationIcon"><i class="bi bi-bell-fill"></i></div>
      <div class="erp-notification-priority text-muted mb-2" id="studentNotificationPriority"></div>
      <h2 class="h4 fw-bold mb-3" id="studentNotificationTitle"></h2>
      <p class="erp-notification-message mb-4" id="studentNotificationMessage"></p>
      <div class="erp-fee-details" id="studentFeeDetails" hidden></div>
      <div class="erp-extension-form" id="studentExtensionForm" hidden>
        <label class="form-label fw-semibold" for="studentExtensionDays">How many extra days do you need?</label>
        <select class="form-select mb-3" id="studentExtensionDays"></select>
        <label class="form-label fw-semibold" for="studentExtensionReason">Reason for the request</label>
        <textarea class="form-control mb-2" id="studentExtensionReason" rows="3" maxlength="1000" placeholder="Briefly explain the financial difficulty (minimum 10 characters)."></textarea>
        <div class="small text-muted mb-3">This is a request only. Your due date changes after institute approval.</div>
        <div class="d-flex gap-2"><button class="btn btn-warning" type="button" id="studentExtensionSubmit">Send request</button><button class="btn btn-outline-secondary" type="button" id="studentExtensionCancel">Cancel</button></div>
        <div class="small mt-2" id="studentExtensionFeedback"></div>
      </div>
      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a class="btn px-4" id="studentNotificationAction" href="#"></a>
        <button type="button" class="btn btn-warning px-4" id="studentExtensionOpen" hidden>Request due-date extension</button>
        <button type="button" class="btn btn-outline-secondary px-4" id="studentNotificationNext">Close</button>
      </div>
      <div class="small text-muted mt-3" id="studentNotificationPosition"></div>
    </div>
  </div></div>
</div>
<script>
document.addEventListener('DOMContentLoaded',function(){
  const modalEl=document.getElementById('studentNotificationModal');if(!modalEl||!window.bootstrap)return;
  const palette={primary:'#0d6efd',danger:'#dc3545',success:'#198754',info:'#0dcaf0',warning:'#f59e0b',secondary:'#6c757d',dark:'#212529'};
  fetch('{{ url_for("notifications.student_applicable") }}',{headers:{'Accept':'application/json'}}).then(r=>r.ok?r.json():{notifications:[]}).then(data=>{
    const queue=data.notifications||[];if(!queue.length)return;let index=0,current=null;const modal=new bootstrap.Modal(modalEl);
    const show=()=>{const item=queue[index],color=palette[item.color]||palette.primary;modalEl.style.setProperty('--notice-color',color);
      current=item;
      document.getElementById('studentNotificationIcon').innerHTML='<i class="bi '+item.icon.replace(/[^a-zA-Z0-9_-]/g,'')+'"></i>';
      document.getElementById('studentNotificationTitle').textContent=item.title;document.getElementById('studentNotificationMessage').textContent=item.message;
      document.getElementById('studentNotificationPriority').textContent='Priority '+item.priority;
      document.getElementById('studentNotificationPosition').textContent=(index+1)+' of '+queue.length;
      const action=document.getElementById('studentNotificationAction');if(item.action_label&&item.action_url){action.textContent=item.action_label;action.href=item.action_url;action.className='btn btn-'+item.color+' px-4';action.style.display='';}else action.style.display='none';
      const details=document.getElementById('studentFeeDetails'),open=document.getElementById('studentExtensionOpen'),form=document.getElementById('studentExtensionForm');form.hidden=true;open.hidden=true;
      if(item.fee){const fee=item.fee,status=fee.extension_status;
        details.hidden=false;details.innerHTML='<div class="d-flex justify-content-between gap-3"><span>Invoice</span><strong></strong></div><div class="d-flex justify-content-between gap-3"><span>Balance due</span><strong></strong></div><div class="d-flex justify-content-between gap-3"><span>Due date</span><strong></strong></div>';
        const strong=details.querySelectorAll('strong');strong[0].textContent=fee.invoice_no;strong[1].textContent=fee.amount;strong[2].textContent=fee.due_date;
        if(status){const state=document.createElement('div');state.className='alert alert-'+(status==='approved'?'success':'info')+' py-2 mt-3 mb-0';state.textContent=status==='approved'?'Extension approved. New due date: '+fee.requested_due_date:'Extension request pending administrator review. Requested date: '+fee.requested_due_date;details.appendChild(state);}
        else open.hidden=!fee.extension_allowed;
      }else details.hidden=true;
      const next=document.getElementById('studentNotificationNext');next.textContent=index<queue.length-1?'Next':'Close';modal.show();};
    document.getElementById('studentNotificationNext').addEventListener('click',()=>{if(index<queue.length-1){index++;show();}else modal.hide();});show();
    document.getElementById('studentExtensionOpen').addEventListener('click',()=>{if(!current||!current.fee)return;const fee=current.fee,select=document.getElementById('studentExtensionDays');select.innerHTML='';for(let days=fee.extension_min_days;days<=fee.extension_max_days;days++){const option=document.createElement('option');option.value=days;option.textContent=days+' days';select.appendChild(option);}document.getElementById('studentExtensionFeedback').textContent='';document.getElementById('studentExtensionForm').hidden=false;document.getElementById('studentExtensionOpen').hidden=true;});
    document.getElementById('studentExtensionCancel').addEventListener('click',()=>{document.getElementById('studentExtensionForm').hidden=true;document.getElementById('studentExtensionOpen').hidden=false;});
    document.getElementById('studentExtensionSubmit').addEventListener('click',async()=>{if(!current||!current.fee)return;const button=document.getElementById('studentExtensionSubmit'),feedback=document.getElementById('studentExtensionFeedback'),reason=document.getElementById('studentExtensionReason').value.trim();if(reason.length<10){feedback.className='small mt-2 text-danger';feedback.textContent='Please enter at least 10 characters.';return;}button.disabled=true;feedback.textContent='Sending…';try{const response=await fetch('{{ url_for("notifications.request_fee_extension") }}',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-CSRFToken':document.querySelector('meta[name="csrf-token"]')?.content||''},body:JSON.stringify({installment_id:current.fee.installment_id,extension_days:Number(document.getElementById('studentExtensionDays').value),reason})});const result=await response.json();if(!response.ok)throw new Error(result.message||'Request failed.');current.fee.extension_allowed=false;current.fee.extension_status='pending';current.fee.requested_due_date=result.requested_due_date;feedback.className='small mt-2 text-success';feedback.textContent=result.message;button.hidden=true;document.getElementById('studentExtensionCancel').textContent='Done';}catch(error){feedback.className='small mt-2 text-danger';feedback.textContent=error.message;}finally{button.disabled=false;}});
  }).catch(()=>{});
});
</script>
