substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:classroom-view
steps:
  - id: build-classroom-view
    name: gcr.io/cloud-builders/docker
    args: [build, --file, deploy/releases/Dockerfile.classroom-view, --tag, '${_IMAGE}', .]
  - id: verify-no-legacy-bootstrap
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --env, APP_ENV=testing, --env, SECRET_KEY=classroom-view-regression-only, --env, PYTHONPATH=/app, '${_IMAGE}', python, scratch/test_no_legacy_bootstrap.py]
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
