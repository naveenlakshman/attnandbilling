substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:invoice-form-admission-ui

steps:
  - id: build-invoice-form-admission-ui
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/releases/Dockerfile.invoice-form-admission-ui
      - --tag
      - ${_IMAGE}
      - .

  - id: verify-invoice-form-admission-ui
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_IMAGE}
      - python
      - tests/test_invoice_form_admission_ui.py

images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
