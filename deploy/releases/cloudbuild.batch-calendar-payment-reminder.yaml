substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:batch-calendar-payment-reminder

steps:
  - id: build-batch-calendar-payment-reminder
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/releases/Dockerfile.batch-calendar-payment-reminder
      - --tag
      - ${_IMAGE}
      - .

  - id: verify-batch-calendar-payment-reminder
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm ${_IMAGE} python -m py_compile \
          modules/attendance/routes.py \
          modules/billing/routes.py \
          modules/lms_admin/routes.py \
          services/batch_schedule.py
        docker run --rm ${_IMAGE} python -c "from pathlib import Path; from jinja2 import Environment; env=Environment(); paths=['/app/templates/attendance/batch_form.html','/app/templates/billing/receivables.html','/app/templates/includes/batch_end_summary.html','/app/templates/lms_admin/classroom_teaching_dashboard.html']; [env.parse(Path(path).read_text(encoding='utf-8-sig')) for path in paths]; attendance=Path('/app/modules/attendance/routes.py').read_text(encoding='utf-8'); billing=Path('/app/modules/billing/routes.py').read_text(encoding='utf-8'); classroom=Path('/app/modules/lms_admin/routes.py').read_text(encoding='utf-8'); assert 'can_edit_start_date' in attendance; assert 'receivable_payment_links' in billing; assert 'batch_start_summary' in classroom"

images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
