substitutions:
  _BASE_IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production@sha256:9e458db762e4617811581907f1a0df32ef64abd25e55e714f62c278332808463
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:expense-hotfix
steps:
  - id: build-hotfix
    name: gcr.io/cloud-builders/docker
    args: [build, --file, deploy/releases/Dockerfile.expense-hotfix, --build-arg, 'BASE_IMAGE=${_BASE_IMAGE}', --tag, '${_IMAGE}', .]
  - id: compile-hotfix
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, '${_IMAGE}', python, -m, py_compile, modules/billing/routes.py]
  - id: verify-no-legacy-bootstrap
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --env, APP_ENV=testing, --env, SECRET_KEY=hotfix-regression-only, --env, PYTHONPATH=/app, '${_IMAGE}', python, scratch/test_no_legacy_bootstrap.py]
  - id: verify-tenant-dashboard
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --env, APP_ENV=testing, --env, SECRET_KEY=hotfix-regression-only, --env, PYTHONPATH=/app, '${_IMAGE}', python, scratch/test_billing_dashboard_tenant_isolation.py]
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
