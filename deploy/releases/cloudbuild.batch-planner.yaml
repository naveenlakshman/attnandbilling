substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:batch-planner
steps:
  - id: build-planner
    name: gcr.io/cloud-builders/docker
    args: [build, --file, deploy/releases/Dockerfile.batch-planner, --tag, '${_IMAGE}', .]
  - id: compile-planner
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, '${_IMAGE}', python, -m, py_compile, modules/attendance/routes.py, services/batch_syllabus_progress.py]
  - id: verify-no-legacy-bootstrap
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --env, APP_ENV=testing, --env, SECRET_KEY=planner-regression-only, --env, PYTHONPATH=/app, '${_IMAGE}', python, scratch/test_no_legacy_bootstrap.py]
images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
