substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/global-it-edu-app/cloud-run-source-deploy/global-it-erp-production:baddebt-repeat-writeoff

steps:
  - id: build-baddebt-repeat-writeoff
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - deploy/releases/Dockerfile.baddebt-repeat-writeoff
      - --tag
      - ${_IMAGE}
      - .

  - id: verify-baddebt-repeat-writeoff
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker run --rm ${_IMAGE} python -m py_compile modules/baddebt/routes.py
        docker run --rm ${_IMAGE} python -c "from pathlib import Path; from jinja2 import Environment; route=Path('/app/modules/baddebt/routes.py').read_text(encoding='utf-8'); create=Path('/app/templates/baddebt/create.html').read_text(encoding='utf-8'); invoice=Path('/app/templates/billing/invoice_view.html').read_text(encoding='utf-8'); env=Environment(); env.parse(create); env.parse(invoice); assert 'total_amount - paid_amount - written_off_amount' in route; assert \"'unpaid', 'partially_paid', 'partially_written_off'\" in route; assert 'data-written-off' in create and 'data-balance' in create; assert \"['unpaid', 'partially_paid', 'partially_written_off']\" in invoice"

images: ['${_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
